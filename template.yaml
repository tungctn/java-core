AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OTP Service with Firebase Authentication

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    MemorySize: 256
    Environment:
      Variables:
        NODE_ENV: production

Resources:
  # Lambda Function để gửi OTP
  SendOtpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: otp-service/
      Handler: index.sendOTPHandler
      Description: Lambda function để gửi mã OTP qua Firebase
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
          FIREBASE_CLIENT_EMAIL: !Ref FirebaseClientEmail
          FIREBASE_PRIVATE_KEY: !Ref FirebasePrivateKey

  # Lambda Function để xác thực OTP
  VerifyOtpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: otp-service/
      Handler: index.verifyOTPHandler
      Description: Lambda function để xác thực mã OTP
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
          FIREBASE_CLIENT_EMAIL: !Ref FirebaseClientEmail
          FIREBASE_PRIVATE_KEY: !Ref FirebasePrivateKey

Parameters:
  FirebaseProjectId:
    Type: String
    Description: Firebase Project ID
    NoEcho: false

  FirebaseClientEmail:
    Type: String
    Description: Firebase Client Email
    NoEcho: false

  FirebasePrivateKey:
    Type: String
    Description: Firebase Private Key
    NoEcho: true

Outputs:
  SendOtpFunction:
    Description: "Send OTP Lambda Function ARN"
    Value: !GetAtt SendOtpFunction.Arn

  VerifyOtpFunction:
    Description: "Verify OTP Lambda Function ARN"
    Value: !GetAtt VerifyOtpFunction.Arn 