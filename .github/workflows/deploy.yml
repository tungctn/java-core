name: Deploy API to AWS Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'adopt'

      - name: Build with maven
        run: |
          cd bank-springboot
          mvn clean install
        
      - name: Get artifact name
        id: get-artifact
        run: |
            echo "::set-output name=artifact_name::$(ls target/*.jar | grep -v 'original' | head -n 1)"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
        
      - name: Generate deployment package
        run: |
          mkdir -p deploy
          cp ${{ steps.get-artifact.outputs.artifact_name }} deploy/application.jar
          cd deploy && zip -r deploy.zip application.jar
          cd .. && cp deploy/deploy.zip .

      - name: Deploy to AWS Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: bank-api
          environment_name: Bank-api-env
          version_label: "v-${{ github.run_number }}-${{ github.sha }}"
          region: ap-southeast-1
          deployment_package: deploy.zip
          wait_for_environment_recovery: 300